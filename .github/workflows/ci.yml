name: CI — Rótulos Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & Auditoría
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: editor/package-lock.json

      - name: Instalar dependencias
        working-directory: editor
        run: npm ci

      - name: Ejecutar tests unitarios
        working-directory: editor
        run: npm test

      - name: Auditoría de seguridad (solo producción)
        working-directory: editor
        run: npm audit --audit-level=high --omit=dev
        # Las vulns de devDeps (vitest@1.x) no bloquean el pipeline.
        # Solo vulnerabilidades en deps de producción con severidad high/critical fallan el CI.
        continue-on-error: false

      - name: Reporte de cobertura (informativo)
        working-directory: editor
        run: npm run test:coverage
        continue-on-error: true
