<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <style>
      .petalo-naranja { fill: #FF7518; opacity: 0.25; }
      .petalo-oro { fill: #FFD700; opacity: 0.3; }
      .petalo-rosa { fill: #E0115F; opacity: 0.18; }
      .destello-vela { fill: #FFF8F0; opacity: 0.35; }
    </style>
  </defs>

  <!-- Pétalos de Cempasúchil flotantes y esparcidos (camino de almas) -->
  <path d="M 20,25 C 24,18 32,20 30,28 C 28,34 22,32 20,25 Z" class="petalo-naranja" transform="rotate(15 25 25)" />
  <path d="M 85,35 C 89,28 97,30 95,38 C 93,44 87,42 85,35 Z" class="petalo-oro" transform="rotate(-30 90 35)" />
  <path d="M 45,75 C 49,68 57,70 55,78 C 53,84 47,82 45,75 Z" class="petalo-oro" transform="rotate(45 50 75)" />
  <path d="M 100,90 C 104,83 112,85 110,93 C 108,99 102,97 100,90 Z" class="petalo-naranja" transform="rotate(-15 105 90)" />

  <!-- Pétalos pequeños flor morada / rosa -->
  <path d="M 15,95 C 18,90 24,91 22,96 C 20,101 16,99 15,95 Z" class="petalo-rosa" transform="rotate(60 18 95)" />
  <path d="M 65,15 C 68,10 74,11 72,16 C 70,21 66,19 65,15 Z" class="petalo-naranja" transform="rotate(-40 68 15)" />

  <!-- Destellos de cirios y velas votivas -->
  <circle cx="50" cy="40" r="1.5" class="destello-vela" />
  <circle cx="95" cy="65" r="1.2" class="destello-vela" />
  <circle cx="30" cy="60" r="1.8" class="destello-vela" />
  <circle cx="75" cy="105" r="1.4" class="destello-vela" />
</svg>
