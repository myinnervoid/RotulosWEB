<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Browser Window Header -->
  <rect width="800" height="44" rx="16" fill="rgba(255,255,255,0.04)" />
  <circle cx="28" cy="22" r="6" fill="#ef4444" />
  <circle cx="46" cy="22" r="6" fill="#f59e0b" />
  <circle cx="64" cy="22" r="6" fill="#10b981" />
  <rect x="100" y="12" width="400" height="20" rx="6" fill="rgba(255,255,255,0.06)" />
  <text x="120" y="26" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">https://mi-landing.local/preview</text>

  <!-- Hero Elements inside Browser -->
  <rect x="48" y="76" width="380" height="24" rx="6" fill="url(#accentGrad)" opacity="0.9" />
  <rect x="48" y="112" width="280" height="14" rx="4" fill="rgba(255,255,255,0.2)" />
  <rect x="48" y="134" width="320" height="14" rx="4" fill="rgba(255,255,255,0.12)" />

  <rect x="48" y="170" width="130" height="36" rx="8" fill="#38bdf8" />
  <text x="113" y="193" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Comenzar</text>

  <rect x="190" y="170" width="130" height="36" rx="8" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
  <text x="255" y="193" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Ver Demo</text>

  <!-- Mockup Graphic / Cards on the Right -->
  <rect x="470" y="76" width="280" height="330" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <circle cx="610" cy="150" r="44" fill="url(#accentGrad)" opacity="0.2" />
  <polygon points="610,120 635,165 585,165" fill="#38bdf8" />
  
  <rect x="500" y="220" width="220" height="12" rx="4" fill="rgba(255,255,255,0.3)" />
  <rect x="520" y="244" width="180" height="10" rx="4" fill="rgba(255,255,255,0.15)" />

  <!-- Bottom Metric Badges -->
  <rect x="48" y="240" width="115" height="166" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" />
  <text x="60" y="280" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">60fps</text>
  <text x="60" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Rendimiento nativo</text>

  <rect x="175" y="240" width="115" height="166" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" />
  <text x="187" y="280" fill="#10b981" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">100%</text>
  <text x="187" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Local & Soberano</text>

  <rect x="302" y="240" width="115" height="166" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" />
  <text x="314" y="280" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">0ms</text>
  <text x="314" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Latencia en disco</text>
</svg>
