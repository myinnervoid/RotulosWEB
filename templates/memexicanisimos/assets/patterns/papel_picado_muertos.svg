<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <style>
      .pp-almena { fill: none; stroke: #FF7518; stroke-width: 1.5; opacity: 0.35; }
      .pp-morado { fill: #8A2BE2; opacity: 0.22; }
      .pp-naranja { fill: #FF7518; opacity: 0.28; }
      .pp-rosa { fill: #E0115F; opacity: 0.25; }
      .pp-oro { fill: #FFD700; opacity: 0.3; }
      .pp-hueso { fill: #FFF8F0; opacity: 0.2; }
    </style>
  </defs>

  <!-- Borde festón / almenas de papel picado en las orillas -->
  <path d="M 0,0 Q 10,12 20,0 Q 30,12 40,0 Q 50,12 60,0 Q 70,12 80,0 Q 90,12 100,0 Q 110,12 120,0 Q 130,12 140,0 Q 150,12 160,0" class="pp-almena" />
  <path d="M 0,160 Q 10,148 20,160 Q 30,148 40,160 Q 50,148 60,160 Q 70,148 80,160 Q 90,148 100,160 Q 110,148 120,160 Q 130,148 140,160 Q 150,148 160,160" class="pp-almena" />

  <!-- Calaverita estilizada central (Calaverita de Azúcar de Papel Picado) -->
  <!-- Cráneo -->
  <path d="M 64,60 C 64,48 72,42 80,42 C 88,42 96,48 96,60 C 96,68 92,72 90,75 L 90,82 C 90,84 88,86 86,86 L 74,86 C 72,86 70,84 70,82 L 70,75 C 68,72 64,68 64,60 Z" class="pp-hueso" />
  <!-- Ojos calavera (rombos calados) -->
  <circle cx="74" cy="58" r="4" class="pp-morado" />
  <circle cx="86" cy="58" r="4" class="pp-morado" />
  <!-- Nariz triangular invertida -->
  <polygon points="80,64 77,69 83,69" class="pp-rosa" />
  <!-- Dientes sonrientes -->
  <line x1="75" y1="80" x2="85" y2="80" stroke="#FF7518" stroke-width="1.2" opacity="0.6" />
  <line x1="77" y1="77" x2="77" y2="83" stroke="#FF7518" stroke-width="1" opacity="0.6" />
  <line x1="80" y1="77" x2="80" y2="83" stroke="#FF7518" stroke-width="1" opacity="0.6" />
  <line x1="83" y1="77" x2="83" y2="83" stroke="#FF7518" stroke-width="1" opacity="0.6" />

  <!-- Flor de Cempasúchil (Rosas/Naranjas caladas laterales) -->
  <circle cx="28" cy="80" r="14" class="pp-naranja" />
  <circle cx="28" cy="80" r="7" class="pp-oro" />
  <circle cx="132" cy="80" r="14" class="pp-naranja" />
  <circle cx="132" cy="80" r="7" class="pp-oro" />

  <!-- Pétalos de cuatrocientos pétalos -->
  <path d="M 28,62 C 22,62 22,72 28,72 C 34,72 34,62 28,62 Z" class="pp-rosa" />
  <path d="M 28,98 C 22,98 22,88 28,88 C 34,88 34,98 28,98 Z" class="pp-rosa" />
  <path d="M 132,62 C 126,62 126,72 132,72 C 138,72 138,62 132,62 Z" class="pp-rosa" />
  <path d="M 132,98 C 126,98 126,88 132,88 C 138,88 138,98 132,98 Z" class="pp-rosa" />

  <!-- Calados geométricos de papel picado (rombos y lágrimas) -->
  <polygon points="80,18 86,28 80,38 74,28" class="pp-oro" />
  <polygon points="80,142 86,132 80,122 74,132" class="pp-morado" />

  <polygon points="20,30 26,38 20,46 14,38" class="pp-rosa" />
  <polygon points="140,30 146,38 140,46 134,38" class="pp-morado" />
  <polygon points="20,130 26,122 20,114 14,122" class="pp-oro" />
  <polygon points="140,130 146,122 140,114 134,122" class="pp-rosa" />

  <!-- Pequeñas calaveritas en esquinas para enlazar el patrón -->
  <circle cx="0" cy="80" r="8" class="pp-naranja" />
  <circle cx="160" cy="80" r="8" class="pp-naranja" />
</svg>
